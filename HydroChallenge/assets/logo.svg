<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" role="img" aria-label="Hydro Challenge SMAN 78 Logo">
  <defs>
    <!-- Bingkai perisai akademik (keluarga visual ArenaFisikaSeru, aksen sian) -->
    <linearGradient id="hcShieldGrad" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="60%" stop-color="#155e75"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Gradien aliran fluida -->
    <linearGradient id="hcFlowGrad" x1="12" y1="24" x2="36" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <filter id="hcGlow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0891b2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Perisai luar -->
  <path d="M24 4 L38 9 C38 23 32 37 24 44 C16 37 10 23 10 9 Z"
        fill="url(#hcShieldGrad)"
        stroke="#67e8f9"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Nozel venturi: saluran melebar -> menyempit -->
  <path d="M14 19 H24 L30 22.5 L30 25.5 L24 29 H14 Z"
        fill="url(#hcFlowGrad)"
        filter="url(#hcGlow)"/>

  <!-- Garis aliran masuk -->
  <path d="M15.5 22.2 H23" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.9"/>
  <path d="M15.5 25.8 H23" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.75"/>

  <!-- Butiran semprotan keluar nozel -->
  <circle cx="33" cy="20.5" r="1.5" fill="#e0f2fe"/>
  <circle cx="36" cy="24" r="1.9" fill="#bae6fd"/>
  <circle cx="33.5" cy="27.8" r="1.5" fill="#e0f2fe"/>
  <circle cx="38.5" cy="19.6" r="1.1" fill="#a5f3fc"/>
  <circle cx="39" cy="28.4" r="1.1" fill="#a5f3fc"/>

  <!-- Pipa pengangkat cairan (atomizer) -->
  <path d="M27 29.5 V35" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
  <path d="M23.6 35 H30.4" stroke="#67e8f9" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Percikan inti -->
  <circle cx="19" cy="24" r="1.2" fill="#ffffff" opacity="0.95"/>
</svg>

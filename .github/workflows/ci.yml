name: CI

# GitHub Pages pada repo ini memakai "Deploy from a branch" (main, /),
# jadi setiap push ke main otomatis terbit. Workflow ini bukan deployer,
# melainkan penjaga kualitas: sintaks, tes, dan tautan aset lokal.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Sintaks, tes, dan tautan
    # Dikunci ke 24.04, bukan ubuntu-latest: Playwright 1.55 belum menyediakan
    # Chromium untuk image ubuntu26.04 yang kini dipakai ubuntu-latest, dan
    # CI-nya gagal di luar kode aplikasi. Mengunci runner membuat hasil uji
    # dapat direproduksi. Naikkan saat Playwright mendukung image baru.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cek sintaks JavaScript
        run: |
          git ls-files -z '*.js' '*.mjs' \
            | xargs -0 -r -n1 node --check

      - name: Cek sintaks Python
        run: |
          git ls-files -z '*.py' \
            | xargs -0 -r -n1 python3 -m py_compile

      - name: Tes VectorArena
        working-directory: VectorArena
        run: npm test --silent

      - name: Tes HydroArena
        working-directory: HydroArena
        run: npm test --silent

      - name: Cek sintaks Code.gs (Apps Script)
        run: |
          cp VectorArena/apps-script/Code.gs "$RUNNER_TEMP/Code.js"
          node --check "$RUNNER_TEMP/Code.js"

      - name: Tes backend Apps Script VectorArena
        run: node VectorArena/apps-script/test-code-gs.cjs

      - name: Cek tautan aset lokal
        run: node scripts/check-links.mjs

      - name: Cek sitemap valid
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml'); print('sitemap.xml valid')"